name: Continuous Integration
run-name: CI • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
    branches: [ main ]
  workflow_call: # Called by release.yaml to gate a release on a green build.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: make setup

      - name: Run tests
        run: make test

      - name: Build # Also builds the rustdoc, which nothing else covers.
        run: make build

      - name: Publish (dry run) # The actual publish happens in release.yaml.
        run: cargo publish --dry-run --locked --workspace
