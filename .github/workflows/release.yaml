name: Release
run-name: Release • main • ${{ github.sha }}

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/pr.yaml

  release:
    name: Create release
    needs: ci
    runs-on: ubuntu-slim
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create GitHub release (Release Please)
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json

  publish:
    name: Publish to crates.io
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write # Trusted publishing.

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up build environment
        run: make setup

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: make publish

  artifacts:
    name: Publish release artifacts
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write # Build provenance.
      attestations: write

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up build environment
        env:
          TARGET: ${{ matrix.target }}
        run: |
          make setup
          rustup target add "$TARGET"

      - name: Build and upload binary
        id: build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sectxt
          manifest-path: sectxtbin/Cargo.toml # The binary lives in a workspace member.
          target: ${{ matrix.target }}
          build-tool: cargo # Native runner per arch, so no cross container.
          locked: true
          checksum: sha256
          include: README.md,LICENSE
          ref: refs/tags/${{ needs.release.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.tar }}
