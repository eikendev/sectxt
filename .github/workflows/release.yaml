name: Release
run-name: Release • main • ${{ github.sha }}

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/pr.yaml

  release:
    name: Create release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # Push tags and create GitHub releases.
      pull-requests: write # Link each release back to its pull request.
      id-token: write # Trusted publishing to crates.io.

    outputs:
      bin_tag: ${{ steps.bin_tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-plz needs the full history to parse commits.
          persist-credentials: false

      - name: Set up build environment
        run: make setup

      - name: Tag and publish (release-plz)
        id: release
        uses: release-plz/action@v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: crates.io authentication is OIDC-based.

      - name: Resolve the binary release tag
        id: bin_tag
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          releases="${RELEASES:-[]}"
          [ -n "$releases" ] || releases='[]'
          tag="$(jq -r '[.[] | select(.package_name == "sectxt") | .tag] | first // ""' <<<"$releases")"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  release_pr:
    name: Open release pull request
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # Push the release branch.
      pull-requests: write # Open and update the release pull request.

    concurrency: # Only the pull request job: a queued release must never be skipped.
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-plz needs the full history to parse commits.
          persist-credentials: false

      - name: Set up build environment
        run: make setup

      - name: Open release pull request (release-plz)
        uses: release-plz/action@v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  artifacts:
    name: Publish release artifacts
    needs: release
    if: ${{ needs.release.outputs.bin_tag != '' }} # Empty unless sectxt itself was released.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: write # Attach the archives to the GitHub release.
      id-token: write # Build provenance.
      attestations: write # Build provenance.

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.bin_tag }}
          persist-credentials: false

      - name: Set up build environment
        env:
          TARGET: ${{ matrix.target }}
        run: |
          make setup
          rustup target add "$TARGET"

      - name: Build and upload binary
        id: build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sectxt
          manifest-path: sectxtbin/Cargo.toml # The binary lives in a workspace member.
          target: ${{ matrix.target }}
          build-tool: cargo-zigbuild # aws-lc-sys compiles C; musl needs a C toolchain.
          locked: true
          checksum: sha256
          include: README.md,LICENSE
          ref: refs/tags/${{ needs.release.outputs.bin_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.tar }}
