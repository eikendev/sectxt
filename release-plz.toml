[workspace]
# Otherwise every commit bumps a version. Dependency updates land as `build`.
release_commits = "^(feat|fix|build)"

[changelog]
header = """
# Changelog

All notable changes to this project are documented below.
"""
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^build", group = "Build" },
    { message = ".*", skip = true },
]

# Bare `vX.Y.Z`: the existing tags and the binstall `pkg-url` depend on it.
[[package]]
name = "sectxt"
changelog_path = "CHANGELOG.md" # Relative to the workspace root.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The GitHub release is the binary's, since that one carries the archives.
[[package]]
name = "sectxtlib"
git_release_enable = false

# Internal crate. Not `release = false`: it must still be updated, so that its
# `sectxtlib` requirement tracks the bump.
[[package]]
name = "sectxtfuzz"
publish = false # Must match the Cargo.toml.
git_tag_enable = false
git_release_enable = false
