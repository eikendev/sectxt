[package]
name = "sectxtlib"
version = "0.5.0"
authors = ["eikendev"]
edition = "2024"
rust-version = "1.85" # Required by edition 2024.
description = "A library for parsing and validating security.txt files as specified in RFC 9116"
homepage = "https://github.com/eikendev/sectxt"
repository = "https://github.com/eikendev/sectxt"
readme = "README.md"
license = "ISC"

[features]
default = ["valuable"]
# Implements `serde::Serialize` for all public types.
serde = ["dep:serde", "chrono/serde", "iri-string/serde", "oxilangtag/serialize"]
# Implements `valuable::Valuable` for all public types, for structured logging with `tracing`.
valuable = ["dep:valuable"]

[dependencies]
chrono = "0.4.20"
iri-string = "0.7.12"
nom = "8"
oxilangtag = "0.1.6"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"
valuable = { version = "0.1.1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
