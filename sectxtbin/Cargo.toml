[package]
name = "sectxt"
version = "0.4.2"
authors = ["eikendev"]
edition = "2021"
description = "A tool for working with security.txt files as specified in RFC 9116"
homepage = "https://github.com/eikendev/sectxt"
repository = "https://github.com/eikendev/sectxt"
readme = "README.md"
license = "ISC"

[dependencies]
sectxtlib = { path = "../sectxtlib", version = "0.4.1" }
anyhow = "1.0.102"
argh = "0.1.19"
futures = "0.3.32"
human-panic = "2.0.8"
reqwest = "0.13.4"
tracing = "0.1.44"
tracing-subscriber = { version = ">=0.3.20", features = ["env-filter", "json", "valuable"] }
url = "2.5.8"
valuable = "0.1.1"

[dependencies.tokio]
version = "1.52.3"
features = ["rt-multi-thread", "macros"]

# Matches the assets uploaded by .github/workflows/release.yaml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
